name: Generate Contribution Gravity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

jobs:
  gravity:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This grants the token the necessary push permissions
    steps:
      - uses: actions/checkout@v6

      - uses: flycran/github-gravity@v1
        with:
          username: Golamjay
          text: Welcome Dev!
          output-path: deploy/gravity.svg
          #color: "white"
          # THIS IS THE NEW STEP: It forces the SVG text to white
      - name: Force text color to white
        run: |
          sed -i 's/fill="#000000"/fill="#ffffff"/gi' deploy/gravity.svg
          sed -i 's/fill="black"/fill="white"/gi' deploy/gravity.svg
          sed -i 's/<text /<text fill="#ffffff" /gi' deploy/gravity.svg

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: output
          keep_files: false
          force_orphan: true
